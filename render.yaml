# Render Blueprint — deploy with: connect GitHub repo → New → Blueprint
# Supabase is the server: no local database, no disk volume, no SQLite file.
# Apply supabase/migrations first with `npx supabase db push`.
services:
  - type: web
    name: buildops
    runtime: docker
    plan: starter
    region: frankfurt        # choose the region closest to your team
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: buildops-documents
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
